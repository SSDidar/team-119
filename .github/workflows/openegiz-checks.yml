name: OpenEgiz checks

on:
  push:
    paths:
      - "Samson_OpenEgiz/**"
      - ".github/workflows/openegiz-checks.yml"
  pull_request:
    paths:
      - "Samson_OpenEgiz/**"
      - ".github/workflows/openegiz-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Samson_OpenEgiz
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Samson_OpenEgiz/package-lock.json
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Node dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build UI
        run: npm run build
